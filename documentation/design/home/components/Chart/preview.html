<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { padding: 24px; }
</style>

<body>
<div class="card ds-stack" style="max-width:560px"><div class="ds-row" style="justify-content:space-between"><b class="heading">Processor</b><b>13%</b></div><svg class="chart" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Processor load over the last day"><path class="grid-line" d="M0 25H300M0 50H300M0 75H300"></path><polygon class="area" points="0,100 0,80 30,78 60,70 90,74 120,52 150,60 180,71 210,76 240,66 270,72 300,79 300,100"></polygon><polyline class="series" points="0,80 30,78 60,70 90,74 120,52 150,60 180,71 210,76 240,66 270,72 300,79" vector-effect="non-scaling-stroke"></polyline></svg><div class="ds-row muted small" style="justify-content:space-between"><span>24 h ago</span><span>now</span></div></div>
</body>
</html>
