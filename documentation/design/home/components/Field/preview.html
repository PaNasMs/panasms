<!-- @dsCard group="Forms" height=430 subtitle="Text, select, multi-line; hint, error, disabled, focus" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { padding: 24px; }
</style>
</head>
<body>
<div class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 24px">
<label class="field">Task name<input class="input" id="f1" type="text" value="Documents"><span class="hint">Optional — uses the local folder name</span></label>
<label class="field">Put disks to sleep<select class="select" id="f2"><option>After 20 minutes</option><option>Never sleep</option></select></label>
<label class="field">HTTP port<input class="input" id="f3" type="text" value="80a" aria-invalid="true" aria-describedby="f3e"><span class="error" id="f3e">Enter a number from 1 to 65535.</span></label>
<label class="field">Connection name<input class="input is-focus" id="f4" type="text" placeholder="For example, Work Dropbox"></label>
<label class="field">Linked account<input class="input" id="f5" type="text" value="Dropbox" disabled><span class="hint">Remove the tasks before changing the account.</span></label>
<label class="field">Addresses with prefix, one per line<textarea class="textarea" id="f6">192.168.1.100/24</textarea></label>
</div>
</body>
</html>
