<!-- @dsCard group="Status" height=330 subtitle="Inline message: neutral, ok, attention, error, with actions" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { padding: 24px; }
</style>
</head>
<body>
<div class="card ds-stack">
<div class="notice"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><div>Times use the NAS time zone. Checks are skipped while RAID is busy.</div></div>
<div class="notice ok"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><div><strong>Network settings saved.</strong>The new address is 192.168.1.100.</div></div>
<div class="notice warn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg><div><strong>Array disk is running on three of four disks.</strong>Replace the failed disk to restore protection.<div class="actions"><button class="button" type="button">Replace disk</button></div></div></div>
<div class="notice danger"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg><div><strong>Cloud is unreachable; retry later.</strong>The task will try again automatically.</div></div>
</div>
</body>
</html>
